# 这个文件让 GitHub 自动帮你打包并发布网站。
# 你只需要把代码传上来（GitHub Desktop 点一下 Push），剩下它自己做，大约 1 分钟。
name: 发布到 GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:        # 也可以在网页上手动点一下触发

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 取出代码
        uses: actions/checkout@v4

      - name: 准备 Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 安装依赖
        run: npm install

      - name: 打包（自动带上仓库名的路径）
        run: npm run pages

      - name: 交给 GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: pages-dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 发布
        id: deployment
        uses: actions/deploy-pages@v4
